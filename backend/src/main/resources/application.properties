# Server Configuration
server.port=8080

# Application Name
spring.application.name=collaborative-board

# H2 Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/studyboard_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=faheem
spring.datasource.password=faheem123

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.collab.board=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Jackson Configuration (JSON)
spring.jackson.time-zone=UTC

# Actuator Configuration
