# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=collaborative-board

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis Configuration
spring.data.redis.url=${REDIS_URL}
spring.data.redis.repositories.enabled=false



# Logging Configuration (quiet by default; set com.collab=DEBUG to trace join/leave)
logging.level.root=INFO
logging.level.com.collab=INFO
logging.level.com.collab.controller.WebSocketController=WARN
logging.level.com.collab.websocket.WebSocketEventListener=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.hibernate.SQL=OFF

# Jackson Configuration (JSON)
spring.jackson.time-zone=UTC

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# NEW: JWT Configuration
# Secret MUST be provided via environment or external config in production
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.allow-multi-room-per-user=false

app.cors.allowed-origin=${FRONTEND_URL}
