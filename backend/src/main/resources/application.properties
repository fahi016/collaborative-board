# Server Configuration
server.port=8080

# Application Name
spring.application.name=collaborative-board

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/studyboard_db
spring.datasource.driverClassName=org.postgresql.Driver
# Credentials MUST be provided via environment or external config in production
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379



# Logging Configuration
logging.level.root=INFO
logging.level.com.collab.board=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Jackson Configuration (JSON)
spring.jackson.time-zone=UTC

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# NEW: JWT Configuration
# Secret MUST be provided via environment or external config in production
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# 86400000 ms = 24 hours


