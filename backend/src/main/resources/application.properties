# Server Configuration
server.port=8080

# Application Name
spring.application.name=collaborative-board

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/studyboard_db
spring.datasource.driverClassName=org.postgresql.Driver
# Credentials MUST be provided via environment or external config in production
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379



# Logging Configuration (quiet by default; set com.collab=DEBUG to trace join/leave)
logging.level.root=INFO
logging.level.com.collab=INFO
logging.level.com.collab.controller.WebSocketController=WARN
logging.level.com.collab.websocket.WebSocketEventListener=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.hibernate.SQL=OFF

# Jackson Configuration (JSON)
spring.jackson.time-zone=UTC

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# NEW: JWT Configuration
# Secret MUST be provided via environment or external config in production
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# 86400000 ms = 24 hours

# If true, a user can be in multiple rooms (e.g. two tabs). If false, one room per user.
app.allow-multi-room-per-user=false

# File Upload Configuration (for future use)
#spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=10MB
